# Alembic configuration. The database URL is not stored here: env.py derives it from the
# application settings (DB_PATH in .env), or from `-x db_path=...` on the command line.
#   uv run alembic upgrade head
#   uv run alembic -x db_path=data/other.db upgrade head
#   uv run alembic revision --autogenerate --rev-id 0002 -m "add something"

[alembic]
script_location = %(here)s/alembic
# Revision files: 0001_initial_schema.py, 0002_... (pass --rev-id when creating one).
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
