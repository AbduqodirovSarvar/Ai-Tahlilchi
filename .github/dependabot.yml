# Weekly update pull requests. Nothing merges by itself: CI (tests, lint, pip-audit, image build)
# must be green and a person reviews each one. Actions are pinned by SHA in the workflows;
# Dependabot keeps those pins (and the version comments) current.
version: 2
updates:
  # Python dependencies. The `uv` ecosystem reads pyproject.toml and also updates uv.lock; the
  # `pip` ecosystem would leave the lock file stale.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Base images pinned by digest in the Dockerfile (Python, uv).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
