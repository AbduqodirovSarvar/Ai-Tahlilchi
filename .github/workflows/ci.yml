name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository. No secrets are needed or used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_PYTHON: "3.13"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint, format, types, layers, deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lock file is up to date
        run: uv lock --check
      - name: ruff check
        run: uv run ruff check . --output-format=github
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy src
      - name: import-linter
        run: uv run lint-imports
      - name: deptry
        run: uv run deptry .
      - name: shellcheck (deployment and ops scripts)
        run: shellcheck -x scripts/ops/*.sh deploy/*.sh
      - name: actionlint (workflows)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  test:
    # Fast feedback: everything except the `slow` marker, with the coverage gates. Measured on a
    # developer machine the whole suite takes 6.5 min without and ~17 min with coverage, so the
    # budget is generous (40 min) and the slow tests run in their own job.
    name: Tests (fast) and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: pytest -m "not slow" (overall branch coverage >= 85%)
        run: uv run pytest -m "not slow"
      - name: Per-package coverage (models, pipeline >= 90%)
        run: uv run python scripts/ops/coverage_gate.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  test-slow:
    # The long-running tests (marker `slow`), without coverage measurement (it multiplies their
    # runtime and the gates above already cover the code they exercise).
    name: Tests (slow)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: pytest -m slow
        run: uv run pytest -m slow --no-cov

  security:
    name: Vulnerabilities and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: pip-audit (known vulnerabilities in locked dependencies)
        run: uv run pip-audit
      - name: gitleaks (secrets in git history)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner .

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ai-tahlilchi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrates, runs as non-root, fails cleanly without secrets)
        run: |
          test "$(docker run --rm --entrypoint id ai-tahlilchi:ci -u)" != "0"
          set +e
          # /data is a tmpfs owned by the app user (a real deployment mounts the bot-data volume).
          docker run --rm --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 \
            -e CONFIG_ERROR_BACKOFF_SECONDS=1 ai-tahlilchi:ci
          status=$?
          set -e
          test "$status" -eq 2
      - name: Smoke test (healthcheck passes on a migrated database)
        run: |
          docker run --rm --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 \
            ai-tahlilchi:ci python -m app.ops.healthcheck
