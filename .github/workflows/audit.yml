name: Dependency audit

# New advisories appear without any commit to this repository, so the audit that runs in CI on
# every push is repeated weekly. It opens no issues and posts nothing: a vulnerability makes the
# run fail, and GitHub's failed-workflow notification (and the red badge on Actions) is the signal.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_PYTHON: "3.13"

jobs:
  pip-audit:
    name: pip-audit (locked dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: pip-audit
        run: uv run pip-audit
