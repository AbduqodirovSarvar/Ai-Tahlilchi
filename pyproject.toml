[project]
name = "ai-tahlilchi"
version = "0.6.1"
description = "Sports analytics advisory system: statistical models + Gemini, delivered via a Telegram bot."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "apscheduler>=3.11,<4",
    "google-genai>=2.32,<3",
    "httpx>=0.28",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "rapidfuzz>=3.14",
    "scipy>=1.18",
    "sqlalchemy[asyncio]>=2.1,<3",
    "structlog>=26.1",
    "tenacity>=9.1",
    "truststore>=0.10.5",
    # zoneinfo has no system tz database on Windows (and minimal containers).
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.16",
    "deptry>=0.25",
    "hypothesis>=6.170",
    "import-linter>=2.15",
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pyyaml>=6.0.3",
    "respx>=0.23",
    "ruff>=0.17",
    # Independent oracle for the isotonic calibration tests (tests/models/test_learning_qa.py).
    "scikit-learn>=1.9",
    "scipy-stubs>=1.18.1.1",
    "trustme>=1.2.1",
]

[build-system]
# Exact pin: the build backend is not covered by uv.lock.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# src layout: the importable package is `app`, located in src/app (see docs/adr/0001-tooling.md).
[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Markdown is excluded: plan documents embed illustrative, not runnable, Python.
extend-exclude = ["alembic/versions", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "PL",
    "RUF", "S", "ASYNC", "DTZ", "T20", "ERA", "PERF", "D", "C90",
    # Preview rule (enabled explicitly below): max nesting depth.
    "PLR1702",
]
# Only the preview rules listed explicitly in `select` are enabled.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Docstrings are required only in src/; asserts, literal values and obviously fake
# credentials (e.g. "42:TEST") are normal in tests.
"tests/**" = ["D", "S101", "S105", "S106", "PLR2004"]
"scripts/**" = ["D"]
# The module name `app.logging` is mandated by the project plan; it never shadows the
# stdlib because every import in the project is absolute.
"src/app/logging.py" = ["A005"]
# CLI quality-gate tool: writing its report to stdout is its purpose.
"scripts/ops/**" = ["T201"]
# User-facing Uzbek texts use typographic dashes (25.10–31.10) on purpose.
"src/app/bot/texts.py" = ["RUF001"]
"tests/bot/**" = ["RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
# No ruff rule counts physical lines; 50 statements is the closest enforceable proxy.
max-statements = 50
max-nested-blocks = 3

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "src"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "redundant-self"]
plugins = ["pydantic.mypy"]

# APScheduler 3 ships no type information.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
markers = [
    "slow: long-running test (seconds to minutes); deselect with -m 'not slow'",
]
filterwarnings = ["error"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["app"]
branch = true
# Measure code running inside async SQLAlchemy greenlets too.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# Overall gate; stricter per-package gates live in scripts/ops/coverage_gate.py.
fail_under = 85
skip_empty = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]

# --------------------------------------------------------------------------- deptry
[tool.deptry]
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
# DEP002 (declared but unused): names listed here are loaded implicitly, never imported.
DEP002 = [
    "tzdata",
]
# DEP004 (dev dependency in non-test code): the CI coverage gate script uses coverage.
DEP004 = ["coverage"]

# --------------------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (higher layers may import lower ones, never the reverse)"
type = "layers"
layers = [
    "app.main",
    "app.bot | app.scheduler",
    "app.services",
    "app.pipeline",
    "app.models | app.sports | app.db | app.llm",
    "app.clients",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "bot talks to the system only through services"
type = "forbidden"
source_modules = ["app.bot"]
forbidden_modules = ["app.pipeline", "app.models", "app.sports", "app.db", "app.llm", "app.clients"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services reach the core only through pipeline"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.models", "app.sports", "app.db", "app.llm", "app.clients"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# The in-memory fake is for the bot's development and tests only. List every new real
# module of app.services here as it is added.
name = "production code never depends on the fake services"
type = "forbidden"
source_modules = [
    "app.pipeline",
    "app.scheduler",
    "app.services.interfaces",
    "app.services.errors",
    "app.services.report_math",
    "app.services.express_math",
    "app.services.real",
]
forbidden_modules = [
    "app.services.fake",
    "app.services._fake_world",
    "app.services._fake_learning",
]

[[tool.importlinter.contracts]]
name = "models are pure (only domain and errors)"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = [
    "app.main", "app.bot", "app.services", "app.pipeline", "app.sports", "app.db", "app.llm",
    "app.clients", "app.config", "app.logging", "app.tls",
    "aiogram", "httpx", "sqlalchemy", "aiosqlite", "apscheduler", "google",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "domain and errors depend on nothing internal"
type = "forbidden"
source_modules = ["app.domain", "app.errors"]
forbidden_modules = [
    "app.main", "app.bot", "app.services", "app.pipeline", "app.models", "app.sports",
    "app.db", "app.llm", "app.clients", "app.config", "app.logging", "app.tls",
]
allow_indirect_imports = true
