# Local / single-host run: `docker compose up -d --build`.
# Secrets come from .env (optional at parse time; the bot refuses to start without
# TELEGRAM_BOT_TOKEN and ADMIN_IDS and logs a clear reason).
services:
  bot:
    build: .
    image: ai-tahlilchi:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: prod
      DB_PATH: /data/app.db
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
